services:
  postgres:
    image: postgres:16-alpine
    container_name: mindcraft-v2-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mindcraft
      POSTGRES_PASSWORD: mindcraft
      POSTGRES_DB: mindcraft_v2
    volumes:
      - mindcraft_v2_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindcraft -d mindcraft_v2"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mindcraft-v2-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    profiles: ["minio"]
    image: bitnami/minio:latest
    container_name: mindcraft-v2-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - mindcraft_v2_minio:/data

volumes:
  mindcraft_v2_pg:
  mindcraft_v2_minio:
